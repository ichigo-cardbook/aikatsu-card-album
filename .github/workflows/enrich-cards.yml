
name: カードのキャラ・コーデ情報を補完

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: カード情報を補完
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path
          from html.parser import HTMLParser
          from collections import defaultdict

          FILE = Path("cards.json")

          idols = [
              "星宮いちご",
              "霧矢あおい",
              "紫吹蘭",
              "音城ノエル",
              "大空あかり",
              "姫石らき",
              "凛堂たいむ",
              "真未夢メエ",
              "姫乃みえる",
              "ハナ",
              "橋本環奈",
              "和央パリン",
          ]

          card_pattern = re.compile(
              r"(E1-\d{2}_(?:ER|PR|R|N)(?:_p\d+)?"
              r"|EP-\d{3}_(?:ER|PR|R|N))"
          )

          # 同じコーデと確認できるカード番号の組
          # 根拠が不明なものは自動で同一扱いしない
          outfit_sets = {
              "オーロラキス": range(1, 5),
              "アイスブルーフリル": range(5, 9),
              "ドリーミースター": range(10, 13),
              "チャーミーリボン": range(13, 17),
              "クリアネスイエロー": range(17, 21),
              "ピンクステージ": range(21, 24),
              "ピンクブロッサム": range(27, 30),
              "天の川コズミック": range(33, 37),
              "ブルーステージ": range(41, 44),
              "ネイビーブロッサム": range(47, 50),
              "レジェンダリールージュ": range(51, 53),
              "サンシャインスターウェイ": range(71, 75),
          }

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.depth = 0
                  self.parts = []
                  self.links = []

              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      if self.depth == 0:
                          self.parts = []
                      self.depth += 1
                  elif self.depth:
                      self.depth += 1

              def handle_endtag(self, tag):
                  if not self.depth:
                      return
                  self.depth -= 1
                  if self.depth == 0:
                      text = "".join(self.parts).strip()
                      if text:
                          self.links.append(text)

              def handle_data(self, text):
                  if self.depth:
                      self.parts.append(text)

          def fetch_page(idol):
              params = urllib.parse.urlencode({
                  "series": "encore",
                  "idol": idol,
                  "view": "grid"
              })
              url = (
                  "https://card-search.com/"
                  "aikatsu-encore/cards?" + params
              )
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0"
                  }
              )
              with urllib.request.urlopen(
                  req, timeout=25
              ) as response:
                  return response.read().decode(
                      "utf-8", errors="replace"
                  )

          def get_name(text, match):
              prefix = text[:match.start()]
              prefix = re.sub(
                  r"^(?:ER|PR|R|N)\s*[★☆]?\s*",
                  "",
                  prefix
              )
              return prefix.strip(" ・　")

          cards = json.loads(
              FILE.read_text(encoding="utf-8")
          )

          if not isinstance(cards, list):
              raise ValueError(
                  "cards.json は配列形式が必要です"
              )

          # サイト内の番号に対応するカードを登録
          by_number = defaultdict(list)

          for card in cards:
              number = str(
                  card.get("number")
                  or card.get("id")
                  or ""
              )
              by_number[number].append(card)

          found_characters = defaultdict(set)
          found_names = {}

          for idol in idols:
              try:
                  html = fetch_page(idol)
                  parser = LinkParser()
                  parser.feed(html)

                  matched = 0

                  for text in parser.links:
                      match = card_pattern.search(text)
                      if not match:
                          continue

                      number = match.group(1)

                      if number not in by_number:
                          continue

                      found_characters[number].add(idol)

                      name = get_name(text, match)
                      if name and len(name) < 100:
                          found_names[number] = name

                      matched += 1

                  print(
                      idol, ":", matched,
                      "件のカードを検出"
                  )

              except Exception as e:
                  print(
                      idol, "の取得に失敗:", str(e)
                  )

              time.sleep(0.5)

          char_updated = 0
          name_updated = 0
          outfit_updated = 0

          for card in cards:
              number = str(
                  card.get("number")
                  or card.get("id")
                  or ""
              )

              # キャラクターが一意に特定できた場合
              characters = found_characters.get(
                  number, set()
              )

              if len(characters) == 1:
                  character = next(iter(characters))
                  if card.get("character") != character:
                      card["character"] = character
                      char_updated += 1

              # 元の名前が欠けている場合に補完
              if (
                  not card.get("name")
                  and number in found_names
              ):
                  card["name"] = found_names[number]
                  name_updated += 1

              # コーデの既知の組み合わせ
              match = re.match(
                  r"^E1-(\d{2})(?:_|$)",
                  number
              )

              if match:
                  serial = int(match.group(1))

                  for outfit, numbers in outfit_sets.items():
                      if serial in numbers:
                          if not card.get("outfit"):
                              card["outfit"] = outfit
                              outfit_updated += 1
                          break

          # 元の画像URLやカードIDを維持
          FILE.write_text(
              json.dumps(
                  cards,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          remaining = [
              str(c.get("number", c.get("id")))
              for c in cards
              if not c.get("character")
          ]

          print("全カード:", len(cards))
          print("キャラ更新:", char_updated)
          print("名前更新:", name_updated)
          print("コーデ更新:", outfit_updated)
          print("キャラ未特定:", len(remaining))
          print("未特定カード:", remaining)

          # 外部サイトが取得できない場合、
          # 既存データを消さずに終了
          PY

      - name: 変更をGitHubに保存
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add cards.json

          if git diff --cached --quiet; then
            echo "変更はありません"
          else
            git commit -m "Enrich card metadata"
            git push
          fi
